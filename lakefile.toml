name = "hex-matrix-mathlib"
defaultTargets = ["HexMatrixMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "v0.7.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d870b9068518a0870842d15a0cd42637ec30b587"

[[lean_lib]]
name = "HexMatrixMathlib"

[[lean_lib]]
name = "HexMatrixMathlibTests"
globs = ["HexMatrixMathlib.Tests"]
