name = "hex-matrix-mathlib"
defaultTargets = ["HexMatrixMathlib"]

# Keep the HexMatrix pin in sync with the hex-matrix repo: bump both together.
leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "365881fb205210e8d27c5eb011f7ddb3fe020373"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "e76a18ae921d8d8907c8ea37235a0ca5b94698cd"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "HexMatrixMathlib"
